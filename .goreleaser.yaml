version: 2

builds:
  # macOS-only release. The embedded speaker links CGO audio codecs
  # (ogg/vorbis/flac/mpg123) statically via absolute Homebrew archive paths
  # (PKG_CONFIG_PATH overrides written by CI), so this build must run on a
  # native macOS runner. Linux builds are not part of the release for now.
  - id: spotgo
    env:
      - CGO_ENABLED=1
    goos:
      - darwin
    goarch:
      - arm64
    main: ./cmd/spotgo/main.go
    flags:
      - -trimpath
    ldflags:
      - -s -w

archives:
  - formats: [tar.gz]
    # this name template makes the OS and Arch compatible with the results of `uname`.
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"