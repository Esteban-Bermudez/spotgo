name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: Install audio dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev libogg-dev libvorbis-dev libflac-dev libmpg123-dev
      - run: go vet ./...
      - run: go build ./cmd/spotgo
      - run: go test ./...
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test]
    # zig cc provides a C cross-compiler with bundled SDKs for all targets,
    # so we build both linux and darwin (CGO on for go-librespot) from a
    # single ubuntu runner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v2
      - name: Install audio dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev libogg-dev libvorbis-dev libflac-dev libmpg123-dev
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
